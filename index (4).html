*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'DM Sans',system-ui,sans-serif;background:#F4F1EB;color:#1A1A1A}
:root{--navy:#0F1E3D;--navy2:#1B3060;--gold:#C9A84C;--gold-d:#A8882A;--cream:#F4F1EB;--surface:#fff;--surface2:#F7F5F0;--border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.14);--muted:#555;--hint:#888;--r-lg:14px;--r-md:8px;--r-sm:6px}
#app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:215px;flex-shrink:0;background:var(--navy);display:flex;flex-direction:column;box-shadow:2px 0 16px rgba(0,0,0,0.18);z-index:10}
.sidebar-logo{padding:24px 22px 18px;border-bottom:1px solid rgba(255,255,255,0.07)}
.logo-mark{font-family:'DM Serif Display',serif;font-size:18px;color:#fff}.logo-mark span{color:var(--gold)}
.logo-sub{font-size:9.5px;color:rgba(255,255,255,0.28);letter-spacing:0.12em;text-transform:uppercase;margin-top:4px}
.sidebar-nav{flex:1;padding:14px 9px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:var(--r-md);color:rgba(255,255,255,0.42);font-size:13px;cursor:pointer;margin-bottom:3px;border:1px solid transparent;transition:all 0.15s;user-select:none}
.nav-item svg{width:15px;height:15px;flex-shrink:0;opacity:0.65}
.nav-item:hover{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.72)}
.nav-item.active{background:rgba(201,168,76,0.15);color:var(--gold);border-color:rgba(201,168,76,0.28);font-weight:700}
.nav-item.active svg{opacity:1}
.sidebar-bottom{padding:14px 22px;border-top:1px solid rgba(255,255,255,0.07);font-size:10px;color:rgba(255,255,255,0.2);line-height:1.8}
.sidebar-bottom b{color:rgba(255,255,255,0.4)}
.main{flex:1;overflow-y:auto;padding:30px 34px;background:var(--cream)}
.pg-title{font-size:23px;font-weight:800;color:var(--navy);margin-bottom:4px;letter-spacing:-0.025em}
.pg-sub{font-size:12.5px;color:var(--hint);margin-bottom:24px}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:22px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:17px 20px;border-top:3px solid var(--gold)}
.stat-lbl{font-size:10px;font-weight:700;color:var(--hint);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px}
.stat-val{font-size:27px;font-weight:900;color:var(--navy);line-height:1;letter-spacing:-0.03em}
.stat-sub{font-size:11px;color:var(--hint);margin-top:3px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px 24px}
.card-title{font-size:13px;font-weight:800;color:var(--navy);margin-bottom:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:15px}
.badge{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 9px;border-radius:20px;background:#F0EDE5;color:var(--muted);white-space:nowrap}
.badge-green{background:rgba(5,150,105,0.1);color:#065f46}
.badge-blue{background:rgba(37,99,235,0.1);color:#1e40af}
.badge-gold{background:rgba(201,168,76,0.14);color:#8a6820}
.badge-navy{background:rgba(27,48,96,0.1);color:var(--navy2)}
.badge-pink{background:rgba(190,24,93,0.1);color:#9d174d}
.btn{padding:8px 17px;border-radius:var(--r-md);border:1px solid var(--border2);background:var(--surface);color:#1A1A1A;font-size:12.5px;font-family:inherit;cursor:pointer;transition:all 0.15s;font-weight:600}
.btn:hover{background:var(--surface2)}
.btn-primary{background:var(--navy2);color:#fff;border-color:var(--navy2)}.btn-primary:hover{background:var(--navy)}
.btn-gold{background:var(--gold);color:#fff;border-color:var(--gold)}.btn-gold:hover{background:var(--gold-d)}
.btn-sm{padding:5px 12px;font-size:11.5px}
.btn-danger{color:#b91c1c;border-color:#fecaca;background:#fff}.btn-danger:hover{background:#fef2f2}
.btn:disabled{opacity:0.38;cursor:not-allowed}
.prog{display:flex;gap:3px}
.prog-seg{flex:1;height:4px;border-radius:2px;background:var(--border)}
.prog-lbl{font-size:10px;color:var(--hint);margin-top:4px}
.co-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:15px}
.co-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;cursor:pointer;position:relative;overflow:hidden;transition:box-shadow 0.2s,transform 0.15s}
.co-card:hover{box-shadow:0 8px 28px rgba(0,0,0,0.1);transform:translateY(-2px)}
.co-accent{position:absolute;top:0;left:0;right:0;height:3px}
.co-name{font-size:14.5px;font-weight:800;color:var(--navy);margin:8px 0 2px}
.co-sector{font-size:11px;color:var(--hint);margin-bottom:10px}
.co-desc{font-size:11.5px;color:var(--muted);line-height:1.6;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.co-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
.back-btn{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--gold);font-size:12.5px;font-family:inherit;cursor:pointer;padding:0;margin-bottom:20px;font-weight:700}
.detail-grid{display:grid;grid-template-columns:3fr 2fr;gap:16px}
.kv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px}
.kv-box{background:var(--surface2);border-radius:var(--r-sm);padding:10px 13px}
.kv-lbl{font-size:10px;color:var(--hint);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px}
.kv-val{font-size:12.5px;font-weight:700;color:var(--navy)}
.hl-list{list-style:none}
.hl-list li{display:flex;gap:9px;margin-bottom:9px;font-size:12.5px;color:var(--muted);line-height:1.55}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:5px}
.journey-step{display:flex;gap:12px;align-items:flex-start;margin-bottom:11px}
.step-circle{width:27px;height:27px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;border:1.5px solid var(--border2);background:var(--surface2);color:var(--hint)}
.step-circle.done{background:var(--navy2);color:#fff;border-color:var(--navy2)}
.step-circle.current{border-width:2px;border-color:var(--navy2);background:var(--surface);color:var(--navy2)}
.step-name{font-size:12.5px;color:var(--hint)}.step-name.done{color:#1A1A1A;font-weight:600}.step-name.current{color:var(--navy2);font-weight:700}
.step-tag{font-size:10px;color:var(--gold);margin-top:1px}
.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:13px}
.inv-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:17px;cursor:pointer;transition:box-shadow 0.2s,transform 0.15s;border-top:3px solid var(--gold)}

.pipe-board{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;margin-bottom:18px}
.pipe-col{flex-shrink:0;width:160px;background:var(--surface2);border-radius:var(--r-md);padding:12px}
.pipe-col-head{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.pipe-badge{background:var(--navy2);color:#fff;border-radius:20px;padding:1px 7px;font-size:10px;font-weight:700}
.pipe-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px;margin-bottom:8px;cursor:pointer;border-left-width:3px;transition:box-shadow 0.15s}

.pipe-item-name{font-size:12px;font-weight:700;color:var(--navy);margin-bottom:3px}
.pipe-item-sub{font-size:10px;color:var(--hint)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;padding:9px 14px;color:var(--hint);font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:0.07em;border-bottom:2px solid var(--border);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--border);color:#1A1A1A;vertical-align:middle}

tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface2)}

.form-2col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-actions{display:flex;gap:10px;margin-top:22px;align-items:center}
.filters{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.filters input,.filters select{padding:8px 12px;border-radius:var(--r-md);border:1px solid var(--border2);background:var(--surface);color:#1A1A1A;font-size:12.5px;font-family:inherit;outline:none}
.filters input{width:210px}
.filters input:focus,.filters select:focus{border-color:var(--gold)}
.toast{position:fixed;bottom:24px;right:24px;background:var(--navy2);color:#fff;padding:11px 18px;border-radius:var(--r-md);font-size:13px;font-weight:600;z-index:999;opacity:0;transform:translateY(8px);transition:all 0.25s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:var(--navy);gap:16px}
.spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,0.1);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.funnel-bars{display:flex;gap:6px;align-items:flex-end;height:110px;padding:0 4px}
.funnel-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.funnel-bar{width:100%;border-radius:3px 3px 0 0}
.funnel-lbl{font-size:9px;color:var(--hint);text-align:center;line-height:1.3}
.funnel-count{font-size:11px;font-weight:800;color:var(--navy)}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
@media(max-width:900px){.stats-row{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.detail-grid{grid-template-columns:1fr}.kv-grid{grid-template-columns:repeat(2,1fr)}}

</head>

// ═══ HELPERS ══════════════════════════════════════
function toast(msg,dur=2400){
  const el=document.getElementById("toast");
  el.textContent=msg; el.classList.add("show");
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("show"),dur);
}
function usd(c){ return c.currency==="EUR"?c.ask*1.08:c.currency==="KES"?c.ask/130:c.ask; }
function fmt(ask,cur){ return cur==="EUR"?`€${(ask/1000).toFixed(0)}K`:cur==="KES"?`KES ${(ask/1000).toFixed(0)}K`:`$${(ask/1000).toFixed(0)}K`; }
function progBar(co){
  return `<div class="prog">${STEPS.map((_,i)=>`<div class="prog-seg" style="background:${i<co.current_step?co.color:'var(--border)'}"></div>`).join("")}</div>`;
}
function switchTab(tab){
  S.tab=tab; S.view=null; S.modal=null;
  document.querySelectorAll(".nav-item").forEach(n=>n.classList.toggle("active",n.dataset.tab===tab));
  render();
}
function openCompany(id){ S.view=S.companies.find(c=>c.id===id); S.tab="portfolio"; document.querySelectorAll(".nav-item").forEach(n=>n.classList.toggle("active",n.dataset.tab==="portfolio")); render(); }
function openInvestor(id){ S.view=S.investors.find(i=>i.id===id); render(); }

// ═══ INIT & DATA LOAD ═════════════════════════════
async function init(){
  try {
    // Load companies
    const {data:cos,error:e1} = await SB.from("companies").select("*").order("created_at",{ascending:true});
    if(e1) throw e1;
    // Load investors
    const {data:invs,error:e2} = await SB.from("investors").select("*").order("created_at",{ascending:true});
    if(e2) throw e2;

    // Seed if empty
    if(!cos || cos.length===0){
      const {data:seeded,error:se} = await SB.from("companies").insert(SEED_COS).select();
      if(se) throw se;
      S.companies = seeded;
    } else { S.companies = cos; }

    if(!invs || invs.length===0){
      const {data:seeded,error:se} = await SB.from("investors").insert(SEED_INV).select();
      if(se) throw se;
      S.investors = seeded;
    } else { S.investors = invs; }

    document.getElementById("loading").style.display="none";
    document.getElementById("app").style.display="flex";
    render();
  } catch(err){
    console.error(err);
    document.getElementById("loading").innerHTML=`
      <div style="font-family:'DM Serif Display',serif;font-size:24px;color:#fff;margin-bottom:16px">GATEWAY<span style="color:#C9A84C"> GLOBAL</span></div>
      <div style="background:rgba(255,255,255,0.08);border-radius:12px;padding:24px;max-width:420px;text-align:center">
        <div style="color:#f87171;font-weight:700;margin-bottom:10px">Connection Error</div>
        <div style="color:rgba(255,255,255,0.6);font-size:13px;line-height:1.7">${err.message||JSON.stringify(err)}</div>
        <button onclick="init()" style="margin-top:16px;padding:8px 20px;background:#C9A84C;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:700">Retry</button>
      </div>`;
  }
}

// ═══ DB OPERATIONS ════════════════════════════════
async function updateCompany(id, updates){
  const {error} = await SB.from("companies").update(updates).eq("id",id);
  if(error){ toast("Save failed: "+error.message); return false; }
  S.companies = S.companies.map(c=>c.id===id?{...c,...updates}:c);
  if(S.view?.id===id) S.view={...S.view,...updates};
  toast("Saved ✓"); return true;
}
async function insertCompany(data){
  const {data:row,error} = await SB.from("companies").insert(data).select().single();
  if(error){ toast("Error: "+error.message); return null; }
  S.companies.push(row); toast("Company added ✓"); return row;
}
async function deleteCompany(id){
  const {error} = await SB.from("companies").delete().eq("id",id);
  if(error){ toast("Delete failed: "+error.message); return false; }
  S.companies = S.companies.filter(c=>c.id!==id); toast("Deleted ✓"); return true;
}
async function updateInvestor(id, updates){
  const {error} = await SB.from("investors").update(updates).eq("id",id);
  if(error){ toast("Save failed: "+error.message); return false; }
  S.investors = S.investors.map(i=>i.id===id?{...i,...updates}:i);
  if(S.view?.id===id) S.view={...S.view,...updates};
  toast("Saved ✓"); return true;
}
async function insertInvestor(data){
  const {data:row,error} = await SB.from("investors").insert(data).select().single();
  if(error){ toast("Error: "+error.message); return null; }
  S.investors.push(row); toast("Investor added ✓"); return row;
}
async function deleteInvestor(id){
  const {error} = await SB.from("investors").delete().eq("id",id);
  if(error){ toast("Delete failed: "+error.message); return false; }
  S.investors = S.investors.filter(i=>i.id!==id); toast("Deleted ✓"); return true;
}

// ═══ RENDER ═══════════════════════════════════════
function render(){
  const mc=document.getElementById("main");
  if(!mc) return;
  if(S.tab==="overview") mc.innerHTML=renderOverview();
  else if(S.tab==="portfolio") mc.innerHTML=S.view?renderCoDetail(S.view):renderPortfolio();
  else if(S.tab==="pipeline") mc.innerHTML=renderPipeline();
  else if(S.tab==="investors") mc.innerHTML=S.view?renderInvDetail(S.view):renderInvestors();
  else if(S.tab==="analytics") mc.innerHTML=renderAnalytics();
  if(S.modal) buildModal();
  requestAnimationFrame(buildCharts);
}

        <span class="badge badge-blue" style="font-size:10px">${inv.type}</span>
      </div>
      <div style="font-size:11.5px;color:var(--muted);line-height:1.55;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${inv.focus}</div>
      <div style="font-size:11px;color:var(--hint);margin-bottom:3px">💰 ${inv.ticket_size}</div>
      <div style="font-size:11px;color:var(--hint);margin-bottom:3px">📍 ${inv.geography}</div>
      <div style="font-size:11px;color:var(--hint)">⏱ ${inv.stage_pref}</div>
      ${inv.notes?`<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-size:10.5px;color:var(--hint);font-style:italic">${inv.notes.slice(0,70)}${inv.notes.length>70?"…":""}</div>`:""}
    </div>`).join("");
}
function refreshInvCards(){ const el=document.getElementById("inv-grid"); if(el) el.innerHTML=getInvCards(); }

function renderInvDetail(inv){
  const rel=S.companies.filter(c=>(c.suggested_investors||[]).some(s=>s.toLowerCase().includes(inv.company.toLowerCase().split(" ")[0])||s.toLowerCase().includes(inv.name.toLowerCase().split(" ")[0])));
  return `
  <button class="back-btn" onclick="S.view=null;render()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg> Back to Investors</button>
  <div class="grid2">
    <div class="card">
      <div style="margin-bottom:18px">
        <div style="font-size:21px;font-weight:900;color:var(--navy)">${inv.name}</div>
        <div style="font-size:13px;color:var(--gold);font-weight:700;margin-top:2px">${inv.company}</div>
      </div>
      ${[["Type",inv.type],["Focus",inv.focus],["Stage",inv.stage_pref],["Ticket",inv.ticket_size],["Region",inv.geography],["Email",inv.email||"Not recorded"]].map(([l,v])=>`
      <div style="display:grid;grid-template-columns:110px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid var(--border)">
        <span style="font-size:10px;font-weight:700;color:var(--hint);text-transform:uppercase;letter-spacing:0.07em">${l}</span>
        <span style="font-size:12.5px">${v}</span>
      </div>`).join("")}
      ${inv.notes?`<div style="background:var(--surface2);border-radius:var(--r-sm);padding:13px;margin-top:14px"><div style="font-size:10px;font-weight:700;color:var(--hint);text-transform:uppercase;margin-bottom:6px">Notes</div><div style="font-size:12.5px;color:var(--muted);line-height:1.65">${inv.notes}</div></div>`:""}
      <div style="margin-top:14px"><button class="btn btn-sm" onclick="openModal('editInv','${inv.id}')">Edit details</button></div>
    </div>
    <div class="card">
      <div class="card-title">Relevant portfolio companies</div>
      ${rel.length===0?`<div style="font-size:12.5px;color:var(--hint)">No direct matches found.</div>`:""}
      ${rel.map(c=>`<div onclick="openCompany('${c.id}')" style="background:var(--surface2);border-radius:var(--r-sm);padding:13px;margin-bottom:9px;cursor:pointer;border-left:3px solid ${c.color}">
        <div style="font-size:13px;font-weight:800;color:var(--navy)">${c.name}</div>
        <div style="font-size:11px;color:var(--hint);margin-top:2px">${c.sector} · ${fmt(c.ask,c.currency)} · ${c.instrument}</div>
      </div>`).join("")}
    </div>
  </div>`;
}

// ── ANALYTICS ─────────────────────────────────────
function renderAnalytics(){
  const cs=S.companies, total=cs.reduce((s,c)=>s+usd(c),0);
  const avg=cs.length?Math.round(cs.reduce((s,c)=>s+(c.current_step/STEPS.length)*100,0)/cs.length):0;
  return `
  <div class="pg-title">Analytics</div>
  <div class="pg-sub">Portfolio performance and investor network insights</div>
  <div class="stats-row">
    <div class="stat-card"><div class="stat-lbl">Total Portfolio</div><div class="stat-val">${cs.length}</div><div class="stat-sub">companies</div></div>
    <div class="stat-card"><div class="stat-lbl">Capital Sought</div><div class="stat-val">$${(total/1000000).toFixed(1)}M</div><div class="stat-sub">USD equivalent</div></div>
    <div class="stat-card"><div class="stat-lbl">Avg. Progress</div><div class="stat-val">${avg}%</div><div class="stat-sub">pipeline completion</div></div>
    <div class="stat-card"><div class="stat-lbl">Investors</div><div class="stat-val">${S.investors.length}</div><div class="stat-sub">tracked</div></div>
  </div>
  <div class="grid2" style="margin-bottom:15px">
    <div class="card"><div class="card-title">Capital ask by company (USD '000)</div><div style="position:relative;height:220px"><canvas id="askChart2"></canvas></div></div>
    <div class="card"><div class="card-title">Capital ask by sector (USD '000)</div><div style="position:relative;height:220px"><canvas id="sectorChart"></canvas></div></div>
  </div>
  <div class="grid2">
    <div class="card">
      <div class="card-title">Pipeline funnel</div>
      <div class="funnel-bars">
        ${STEPS.map((step,i)=>{
          const count=cs.filter(c=>c.current_step-1>=i).length;
          const pct=cs.length?count/cs.length:0;
          const h=Math.max(Math.round(pct*95),pct>0?10:0);
          return `<div class="funnel-col">
            <div class="funnel-count">${count}</div>
            <div class="funnel-bar" style="height:${h}px;background:rgba(27,48,96,${0.12+pct*0.78})"></div>
            <div class="funnel-lbl">${step}</div>
          </div>`;
        }).join("")}
      </div>
    </div>
    <div class="card"><div class="card-title">Investor type breakdown</div><div style="position:relative;height:160px"><canvas id="invTypeChart"></canvas></div></div>
  </div>`;
}

// ═══ CHARTS ═══════════════════════════════════════
const CI={};
function destroyChart(id){ if(CI[id]){CI[id].destroy();delete CI[id];} }
function buildCharts(){
  const cs=S.companies;
  const CC=["#1B3060","#2D7D46","#7B5EA7","#C9A84C","#1A6B3C","#2563EB","#D97706","#DC2626","#059669","#9333EA","#0891B2","#BE185D"];
  const coColors=cs.map((c,i)=>c.color&&c.color!==''?c.color:CC[i%CC.length]);

  if(document.getElementById("askChart")){
    destroyChart("askChart");
    CI["askChart"]=new Chart(document.getElementById("askChart"),{type:"bar",data:{labels:cs.map(c=>c.name.split(" ")[0]),datasets:[{data:cs.map(c=>Math.round(usd(c)/1000)),backgroundColor:coColors,borderRadius:6,borderSkipped:false}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`$${ctx.parsed.y}K`}}},scales:{x:{grid:{display:false},ticks:{font:{size:10}}},y:{grid:{color:"rgba(0,0,0,0.04)"},ticks:{font:{size:10},callback:v=>`$${v}K`}}}}});
  }
  if(document.getElementById("instrChart")){
    destroyChart("instrChart");
    const instrs=[...new Set(cs.map(c=>c.instrument))];
    CI["instrChart"]=new Chart(document.getElementById("instrChart"),{type:"doughnut",data:{labels:instrs,datasets:[{data:instrs.map(i=>cs.filter(c=>c.instrument===i).length),backgroundColor:CC,borderWidth:2,borderColor:"#fff"}]},options:{responsive:true,maintainAspectRatio:false,cutout:"60%",plugins:{legend:{position:"right",labels:{font:{size:11},padding:10}}}}});
  }
  if(document.getElementById("askChart2")){
    destroyChart("askChart2");
    CI["askChart2"]=new Chart(document.getElementById("askChart2"),{type:"bar",data:{labels:cs.map(c=>c.name.split(" ")[0]),datasets:[{data:cs.map(c=>Math.round(usd(c)/1000)),backgroundColor:coColors,borderRadius:6,borderSkipped:false}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`$${ctx.parsed.y}K`}}},scales:{x:{grid:{display:false},ticks:{font:{size:10}}},y:{grid:{color:"rgba(0,0,0,0.04)"},ticks:{font:{size:10},callback:v=>`$${v}K`}}}}});
  }
  if(document.getElementById("sectorChart")){
    destroyChart("sectorChart");
    const sectors=[...new Set(cs.map(c=>c.sector))];
    CI["sectorChart"]=new Chart(document.getElementById("sectorChart"),{type:"bar",data:{labels:sectors.map(s=>s.split("/")[0].trim()),datasets:[{data:sectors.map(s=>Math.round(cs.filter(c=>c.sector===s).reduce((t,c)=>t+usd(c),0)/1000)),backgroundColor:CC,borderRadius:6,borderSkipped:false}]},options:{indexAxis:"y",responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`$${ctx.parsed.x}K`}}},scales:{x:{grid:{color:"rgba(0,0,0,0.04)"},ticks:{font:{size:10},callback:v=>`$${v}K`}},y:{grid:{display:false},ticks:{font:{size:10}}}}}});
  }
  if(document.getElementById("invTypeChart")){
    destroyChart("invTypeChart");
    const types=[...new Set(S.investors.map(i=>i.type))];
    CI["invTypeChart"]=new Chart(document.getElementById("invTypeChart"),{type:"doughnut",data:{labels:types,datasets:[{data:types.map(t=>S.investors.filter(i=>i.type===t).length),backgroundColor:CC,borderWidth:2,borderColor:"#fff"}]},options:{responsive:true,maintainAspectRatio:false,cutout:"55%",plugins:{legend:{position:"right",labels:{font:{size:11},padding:8}}}}});
  }
}

// ═══ MODALS ═══════════════════════════════════════
function openModal(type,id){ S.modal={type,id:id||null}; buildModal(); }
function closeModal(){ document.getElementById("modal-el")?.remove(); S.modal=null; }
function buildModal(){
  document.getElementById("modal-el")?.remove();
  const {type,id}=S.modal;
  const co=id?S.companies.find(c=>c.id===id):null;
  const inv=id?S.investors.find(i=>i.id===id):null;
  const wrap=document.createElement("div");
  wrap.id="modal-el"; wrap.className="modal-overlay";
  wrap.onclick=e=>{ if(e.target===wrap) closeModal(); };

  if(type==="addCo"||type==="editCo"){
    const d=co||{name:"",sector:"",stage:"Early Stage",ask:"",currency:"USD",instrument:"Equity",founder_gender:"Male",location:"Kenya",website:"",revenue:"",description:"",founder_name:"",founder_email:"",highlights:[],suggested_investors:[],notes:""};
    wrap.innerHTML=`<div class="modal-box">
      <div class="modal-title">${co?"Edit Company":"Add New Company"}</div>
      <div class="form-row"><label class="form-lbl">Company Name *</label><input class="form-input" id="f-name" value="${d.name||""}"></div>
      <div class="form-2col">
        <div class="form-row"><label class="form-lbl">Sector</label><input class="form-input" id="f-sector" value="${d.sector||""}"></div>
        <div class="form-row"><label class="form-lbl">Stage</label><input class="form-input" id="f-stage" value="${d.stage||""}"></div>
      </div>
      <div class="form-2col">
        <div class="form-row"><label class="form-lbl">Ask Amount</label><input class="form-input" id="f-ask" type="number" value="${d.ask||""}"></div>
        <div class="form-row"><label class="form-lbl">Currency</label><select class="form-input" id="f-currency">${["USD","EUR","KES"].map(o=>`<option ${d.currency===o?"selected":""}>${o}</option>`).join("")}</select></div>
      </div>
      <div class="form-2col">
        <div class="form-row"><label class="form-lbl">Instrument</label><select class="form-input" id="f-instr">${["Equity","Equity (8%)","Debt","Debt + Grant","Revenue Share"].map(o=>`<option ${d.instrument===o?"selected":""}>${o}</option>`).join("")}</select></div>
        <div class="form-row"><label class="form-lbl">Founder Gender</label><select class="form-input" id="f-gender">${["Male","Female","TBC"].map(o=>`<option ${d.founder_gender===o?"selected":""}>${o}</option>`).join("")}</select></div>
      </div>
      <div class="form-2col">
        <div class="form-row"><label class="form-lbl">Location</label><input class="form-input" id="f-location" value="${d.location||""}"></div>
        <div class="form-row"><label class="form-lbl">Website</label><input class="form-input" id="f-website" value="${d.website||""}"></div>
      </div>
      <div class="form-2col">
        <div class="form-row"><label class="form-lbl">Founder Name</label><input class="form-input" id="f-founder" value="${d.founder_name||""}"></div>
        <div class="form-row"><label class="form-lbl">Founder Email</label><input class="form-input" id="f-email" value="${d.founder_email||""}"></div>
      </div>
      <div class="form-row"><label class="form-lbl">Revenue</label><input class="form-input" id="f-revenue" value="${d.revenue||""}"></div>
      <div class="form-row"><label class="form-lbl">Description</label><textarea class="form-input" id="f-desc">${d.description||""}</textarea></div>
      <div class="form-row"><label class="form-lbl">Key Highlights (one per line)</label><textarea class="form-input" id="f-hl">${(d.highlights||[]).join("\n")}</textarea></div>
      <div class="form-row"><label class="form-lbl">Suggested Investors (comma-separated)</label><textarea class="form-input" id="f-inv">${(d.suggested_investors||[]).join(", ")}</textarea></div>
      <div class="form-row"><label class="form-lbl">Notes</label><textarea class="form-input" id="f-notes">${d.notes||""}</textarea></div>
      <div class="form-actions">
        <button class="btn btn-primary" onclick="saveCo('${id||""}')">Save</button>
        <button class="btn" onclick="closeModal()">Cancel</button>
        ${co?`<button class="btn btn-danger" style="margin-left:auto" onclick="doDeleteCo('${id}')">Delete</button>`:""}
      </div>
    </div>`;
  }

  if(type==="addInv"||type==="editInv"){
    const d=inv||{name:"",company:"",type:"VC",focus:"",stage_pref:"",ticket_size:"",geography:"Africa",email:"",notes:""};
    wrap.innerHTML=`<div class="modal-box">
      <div class="modal-title">${inv?"Edit Investor":"Add New Investor"}</div>
      <div class="form-2col">
        <div class="form-row"><label class="form-lbl">Contact Name</label><input class="form-input" id="f-name" value="${d.name||""}"></div>
        <div class="form-row"><label class="form-lbl">Company / Fund *</label><input class="form-input" id="f-company" value="${d.company||""}"></div>
      </div>
      <div class="form-2col">
        <div class="form-row"><label class="form-lbl">Type</label><input class="form-input" id="f-type" value="${d.type||""}"></div>
        <div class="form-row"><label class="form-lbl">Geography</label><input class="form-input" id="f-geo" value="${d.geography||""}"></div>
      </div>
      <div class="form-row"><label class="form-lbl">Investment Focus</label><textarea class="form-input" id="f-focus">${d.focus||""}</textarea></div>
      <div class="form-2col">
        <div class="form-row"><label class="form-lbl">Stage Preference</label><input class="form-input" id="f-stage" value="${d.stage_pref||""}"></div>
        <div class="form-row"><label class="form-lbl">Ticket Size</label><input class="form-input" id="f-ticket" value="${d.ticket_size||""}"></div>
      </div>
      <div class="form-row"><label class="form-lbl">Email</label><input class="form-input" id="f-email" value="${d.email||""}"></div>
      <div class="form-row"><label class="form-lbl">Notes</label><textarea class="form-input" id="f-notes">${d.notes||""}</textarea></div>
      <div class="form-actions">
        <button class="btn btn-primary" onclick="saveInv('${id||""}')">Save</button>
        <button class="btn" onclick="closeModal()">Cancel</button>
        ${inv?`<button class="btn btn-danger" style="margin-left:auto" onclick="doDeleteInv('${id}')">Delete</button>`:""}
      </div>
    </div>`;
  }
  document.body.appendChild(wrap);
}

async function saveCo(existingId){
  const name=document.getElementById("f-name")?.value.trim();
  if(!name){toast("Company name is required");return;}
  const vals={
    name, sector:document.getElementById("f-sector")?.value||"",
    stage:document.getElementById("f-stage")?.value||"",
    ask:Number(document.getElementById("f-ask")?.value)||0,
    currency:document.getElementById("f-currency")?.value||"USD",
    instrument:document.getElementById("f-instr")?.value||"Equity",
    founder_gender:document.getElementById("f-gender")?.value||"TBC",
    location:document.getElementById("f-location")?.value||"",
    website:document.getElementById("f-website")?.value||"",
    founder_name:document.getElementById("f-founder")?.value||"",
    founder_email:document.getElementById("f-email")?.value||"",
    revenue:document.getElementById("f-revenue")?.value||"",
    description:document.getElementById("f-desc")?.value||"",
    highlights:(document.getElementById("f-hl")?.value||"").split("\n").map(s=>s.trim()).filter(Boolean),
    suggested_investors:(document.getElementById("f-inv")?.value||"").split(",").map(s=>s.trim()).filter(Boolean),
    notes:document.getElementById("f-notes")?.value||""
  };
  if(existingId){
    await updateCompany(existingId,vals);
    closeModal(); render();
  } else {
    vals.id="c"+Date.now();
    vals.current_step=1;
    vals.color=PALETTE[S.companies.length%PALETTE.length];
    await insertCompany(vals);
    closeModal(); render();
  }
}

async function doDeleteCo(id){
  if(!confirm("Delete this company? Cannot be undone.")) return;
  await deleteCompany(id); S.view=null; closeModal(); render();
}

async function saveInv(existingId){
  const company=document.getElementById("f-company")?.value.trim();
  if(!company){toast("Company name is required");return;}
  const vals={
    name:document.getElementById("f-name")?.value||"",
    company,
    type:document.getElementById("f-type")?.value||"",
    focus:document.getElementById("f-focus")?.value||"",
    stage_pref:document.getElementById("f-stage")?.value||"",
    ticket_size:document.getElementById("f-ticket")?.value||"",
    geography:document.getElementById("f-geo")?.value||"",
    email:document.getElementById("f-email")?.value||"",
    notes:document.getElementById("f-notes")?.value||""
  };
  if(existingId){
    await updateInvestor(existingId,vals);
    closeModal(); render();
  } else {
    vals.id="i"+Date.now();
    await insertInvestor(vals);
    closeModal(); render();
  }
}

async function doDeleteInv(id){
  if(!confirm("Delete this investor? Cannot be undone.")) return;
  await deleteInvestor(id); S.view=null; closeModal(); render();
}

// ═══ START ════════════════════════════════════════
init();
</script>
</body>
</html>
